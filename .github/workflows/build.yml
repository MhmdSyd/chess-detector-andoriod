name: Build APK
on:
  push:
    paths-ignore:            # documentation-only pushes do not need a new APK
      - '**.md'
      - 'docs/**'
      - '.github/screenshots/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      use_opencv:
        description: "Include OpenCV (contour board detector). Turn OFF only if the build fails because of OpenCV."
        type: boolean
        default: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev build-essential ccache

      - name: Download Stockfish for Android
        run: |
          mkdir -p libs/arm64-v8a
          curl -L -o sf.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-android-armv8.tar
          tar xf sf.tar stockfish/stockfish-android-armv8
          cp stockfish/stockfish-android-armv8 libs/arm64-v8a/libstockfish.so
          rm -rf sf.tar stockfish

      - name: Remove OpenCV from the app (only when switched off)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_opencv == false }}
        run: sed -i 's/,opencv//' buildozer.spec

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython virtualenv

      - name: Cache Buildozer downloads (SDK, NDK)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-${{ inputs.use_opencv }}

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessAnalyzer-apk
          path: bin/*.apk

      - name: Upload build log (if it failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: .buildozer/logs/*
          if-no-files-found: ignore
